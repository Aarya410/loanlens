name: CI/CD — Build · Test · Deploy


on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"


jobs:
  build:
    name: "Stage 1 · Build"
    runs-on: ubuntu-latest

    steps:
      - name: ⬇ Checkout code
        uses: actions/checkout@v4

      - name:  Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name:  Install all dependencies
        run: pip install -r requirements-dev.txt

      - name:  Train ML model
        run: python train.py

      - name:  Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: "*.pkl"
          retention-days: 1


  test:
    name: "Stage 2 · Test"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: ⬇ Checkout code
        uses: actions/checkout@v4

      - name:  Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name:  Install all dependencies
        run: pip install -r requirements-dev.txt

      - name: ⬇ Download trained model from Build stage
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name:  Lint — ruff check
        run: ruff check .

      - name:  Run pytest suite
        run: pytest -q --tb=short


  deploy:
    name: "Stage 3 · Deploy"
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: ⬇ Checkout code
        uses: actions/checkout@v4


      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name:  Generate build metadata
        id: meta
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name:  Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name:  Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"

      - name:  Smoke test — wait for live version to match this commit
        run: |
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Waiting for version $short to go live..."
          for i in $(seq 1 40); do
            v=$(curl -fsS "${{ secrets.APP_URL }}/api/health" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" \
              || true)
            echo "  attempt $i/40 — live: '$v'  want: '$short'"
            [ "$v" = "$short" ] && echo " Deployment confirmed live!" && exit 0
            sleep 15
          done
          echo " Deployment did not go live within 10 minutes" && exit 1
